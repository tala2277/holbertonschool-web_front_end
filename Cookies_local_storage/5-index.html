<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
</head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", function(){
            // Create an array availableItems that will contain all the available items.
            availableItems = ["Shampoo", "Soap", "Sponge", "Water"];
            // Create function addItemToCart:
            const addItemToCart = (item) => {
                // Adds a key to the local storage of the name of the item, and set the value to true.    
                localStorage.setItem(item, true);
            }

            // Create function createStore:
            const createStore = () => {
                // Create a ul and append it to the DOM
                const itemsList = document.createElement("ul")
                document.body.append(itemsList)
                // Loops through the array of items, and create a list item to add to the ul
                availableItems.forEach(storedItem => {
                    const listItem = document.createElement("li");
                    listItem.textContent = storedItem;
                    // The item should display the name of the available product
                    itemsList.append(listItem);
                    // On click the item should call the function addItemToCart
                    listItem.addEventListener("click", function() {
                        addItemToCart(storedItem);
                    });
                });
            }

            // Create function displayCart:
            const displayCart = () => {
                // If the local storage does not contain any item, 
                // this function does not do anything.
                // If the local storage contains any item, 
                // it should display a message appenned to the body.
                if (localStorage.length != 0) {
                    const numberOfItems = localStorage.length
                    let checkCart = document.createElement("p");
                    checkCart.textContent = "You previously had " + numberOfItems + " items in your cart"
                    document.body.append(checkCart);
                }
            }

            const x = document.getElementById("result");
            if (typeof(Storage) === "undefined") {
                // If Local storage is not enabled on browser, 
                // display an alert that will contain a message.
                alert("Sorry, your browser does not support Web storage. Try again with a better one");
            } else {
                // If local storage is available it should allow the user to see the application 
                // and call the functions createStore and displayCart.
                createStore();
                displayCart();
            }
        });
    </script>
</body>
</html>
